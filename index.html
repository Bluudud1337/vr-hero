<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero City Demo</title>
<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#050510;
}
canvas{
    display:block;
}
#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    background:rgba(0,0,0,.5);
    padding:10px;
    border-radius:10px;
}
</style>
</head>
<body>

<div id="ui">
    WASD = Move<br>
    Mouse = Look<br>
    Space = Boost
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let player = {
    x:0,
    z:0,
    speed:0
};

const buildings = [];

for(let i=0;i<250;i++){
    buildings.push({
        x:(Math.random()-0.5)*200,
        z:Math.random()*300+20,
        h:Math.random()*20+5,
        w:Math.random()*5+3
    });
}

const keys = {};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

function update(){

    let moveSpeed = 0.5;

    if(keys[" "]) moveSpeed = 2;

    if(keys["w"]) player.z += moveSpeed;
    if(keys["s"]) player.z -= moveSpeed;
    if(keys["a"]) player.x -= moveSpeed;
    if(keys["d"]) player.x += moveSpeed;
}

let crystalAngle = 0;

function render(){

    ctx.fillStyle="#050510";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const horizon = canvas.height*0.55;

    ctx.fillStyle="#0f1020";
    ctx.fillRect(0,horizon,canvas.width,canvas.height);

    ctx.strokeStyle="#252545";

    for(let i=0;i<40;i++){
        const y = horizon + i*20;
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }

    const sorted = [...buildings].sort((a,b)=>
        (b.z-player.z)-(a.z-player.z)
    );

    for(const b of sorted){

        const dz = b.z-player.z;

        if(dz <= 1) continue;

        const scale = 600/dz;

        const screenX =
            canvas.width/2 +
            (b.x-player.x)*scale;

        const width = b.w*scale;
        const height = b.h*scale;

        ctx.fillStyle="#151528";

        ctx.fillRect(
            screenX-width/2,
            horizon-height,
            width,
            height
        );

        ctx.fillStyle="#9b7dff";

        for(let wy=10;wy<height;wy+=18){
            for(let wx=8;wx<width;wx+=14){

                ctx.fillRect(
                    screenX-width/2+wx,
                    horizon-height+wy,
                    5,
                    5
                );
            }
        }
    }

    crystalAngle += 0.03;

    const crystalX =
        canvas.width/2 +
        Math.sin(crystalAngle)*180;

    const crystalY =
        120 +
        Math.cos(crystalAngle*2)*20;

    ctx.fillStyle="#c7a7ff";

    ctx.beginPath();
    ctx.arc(
        crystalX,
        crystalY,
        25,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.strokeStyle="#ffffff";

    ctx.beginPath();
    ctx.moveTo(canvas.width/2-10,canvas.height/2);
    ctx.lineTo(canvas.width/2+10,canvas.height/2);
    ctx.moveTo(canvas.width/2,canvas.height/2-10);
    ctx.lineTo(canvas.width/2,canvas.height/2+10);
    ctx.stroke();
}

function loop(){
    update();
    render();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
